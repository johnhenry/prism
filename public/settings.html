<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism — Configure</title>
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon"></div>
    <h1>PRISM</h1>
  </div>
  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Connecting...</span>
  </div>
</header>

<nav class="page-nav">
  <a href="./">Capture</a>
  <a href="./diff">Analyze</a>
  <a href="./transform" class="proxy-only">Rewrite Rules</a>
  <a href="./settings" class="active">Configure</a>
  <a href="./ws">WebSockets</a>
  <a href="./route-editor">Routes</a>
</nav>

<div class="page-content">
  <h2>Configuration</h2>
  <div id="configDisplay" class="config-grid"></div>
</div>

<script type="module">
import { PrismClient } from './shared/prism-client.mjs';

const basePath = new URL('.', location.href).pathname.replace(/\/$/, '');
const client = new PrismClient(basePath);

const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

// No SSE needed — just check health for status dot
async function checkStatus() {
  try {
    const health = await client.fetchHealth();
    statusDot.classList.add('connected');
    statusText.textContent = 'Live';
    if (health.mode) document.body.dataset.mode = health.mode;
  } catch {
    statusDot.classList.remove('connected');
    statusText.textContent = 'Offline';
  }
}
checkStatus();

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── Config display ──────────────────────────────────────────────
async function loadConfig() {
  try {
    const health = await client.fetchHealth();
    const grid = document.getElementById('configDisplay');
    const items = [
      ['Mode', health.mode],
      ['Target', health.target || 'none'],
      ['Targets', health.targets ? JSON.stringify(health.targets) : 'none'],
      ['Captured', health.captured],
      ['Max History', health.maxHistory],
      ['Max Body Size', `${health.maxBodySize} bytes`],
      ['Persistence', health.persist ? 'enabled' : 'disabled'],
      ['Uptime', `${Math.floor(health.uptime)}s`],
    ];
    grid.innerHTML = items.map(([k, v]) =>
      `<span class="config-key">${k}</span><span class="config-val">${esc(String(v))}</span>`
    ).join('');
  } catch {}
}

loadConfig();
</script>
</body>
</html>
